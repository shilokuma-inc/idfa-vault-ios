<!doctype html>
<!--
  App Store のクリエイティブアセット（プロダクトページのヘッダー / 検索結果）の元。
  Tools/render_creative_assets.sh が Chrome で開いて実寸で書き出す。直接開くときは
  creative.html?type=header&lang=ja&screens=01_home のように指定する
  （同じフォルダの screens/<言語>/ に 6.9 inch のスクリーンショット、icon.png にアプリアイコンが要る）。

  色はアプリのヒートティント（IDFAVault/Design/HeatTint.swift）に合わせ、文言は 12 言語で書いた。
  アプリと同じく角丸を使わないので、機能のチップは左右を尖らせた六角形にしている（端末の枠とアプリアイコンは除く）。

  方針（https://developer.apple.com/app-store/asset-best-practices/）
  - ヘッダー（21:9）: 初めて来た人向けに、アプリのいちばんの価値を 1 つだけ伝える。
    端末によって左右が切れるので、文言と端末は中央に寄せる。
  - 検索結果（3:2）: 何をするアプリかが一目でわかるよう、実際の画面と主な機能を見せる。
  - 他社のロゴ・価格・URL・受賞歴は入れない。文言は短く、言語ごとに訳す。
-->
<html>
<head>
<meta charset="utf-8">
<style>
  /* アプリのヒートティントの配色（HeatTint.base・HeatTintBackground の光・lavender） */
  :root {
    --background: #03030a;
    --background-2: #1b1f4a;
    --highlight: #c9c2ff;
    --accent: #5a56d8;
    --text: #e6ebfa;
    --text-2: rgba(220, 227, 250, 0.76);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: var(--background);
    color: var(--text);
    font-family: "SF Pro Display", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* 漢字・かな・ハングルは、それぞれの言語の書体にする */
  body[data-lang="ja"] { font-family: "Hiragino Sans", "SF Pro Display", sans-serif; }
  body[data-lang="zh-Hans"] { font-family: "SF Pro Display", "PingFang SC", sans-serif; }
  body[data-lang="zh-Hant"] { font-family: "SF Pro Display", "PingFang TC", sans-serif; }
  body[data-lang="ko"] { font-family: "SF Pro Display", "Apple SD Gothic Neo", sans-serif; }

  .canvas { position: relative; width: 100vw; height: 100vh; overflow: hidden;
    background:
      radial-gradient(ellipse 60% 70% at 50% 100%, color-mix(in srgb, var(--accent) 45%, transparent), transparent 70%),
      radial-gradient(ellipse 90% 80% at 50% 0%, var(--background-2), var(--background) 75%); }

  /* box-shadow の大きなぼかしは Chrome で四角い継ぎ目が出るので、光はグラデーションで描く */
  .glow { position: absolute; border-radius: 50%;
    background: radial-gradient(circle, color-mix(in srgb, var(--highlight) 32%, transparent) 0%, transparent 70%); }

  .phone { position: absolute; border-radius: 9.5%/4.4%; background: #0c0d10; padding: 1.6%;
    box-shadow: 0 0 0 4px #3a3d46, 0 60px 140px rgba(0, 0, 0, 0.6); }
  .phone img { display: block; width: 100%; border-radius: 8.4%/3.9%; }

  /* 日本語は文節で折り返す（「コピ / ー」のように語の途中で切らない） */
  .headline, .sub, .copy .title { word-break: auto-phrase; line-break: strict; }
  /* 折り返したときに、2 行目が 1 語だけにならないよう行の長さをそろえる */
  .headline, .sub { text-wrap: balance; }
  /* ヘッダーは端末によって左右が切れるので、文字は中央の 2640px に収める（長い言語は折り返す） */
  .headline { position: absolute; left: 600px; right: 600px; text-align: center; font-weight: 800; letter-spacing: -0.01em; }
  .headline em, .copy .title em { font-style: normal; color: var(--highlight); }
  .sub { position: absolute; left: 600px; right: 600px; text-align: center; color: var(--text-2); font-weight: 500; line-height: 1.3; }

  .copy { position: absolute; }
  .copy .title { font-weight: 800; line-height: 1.18; letter-spacing: -0.01em; }
  .chips { display: flex; flex-direction: column; gap: 0.55em; }
  /* 角丸の代わりに、左右を尖らせた六角形（アプリの StatusBadge と同じ形） */
  /* チップは折り返さない（長い言語は文言を短くする） */
  .chip { display: inline-flex; align-items: center; gap: 0.6em; align-self: flex-start; white-space: nowrap;
    padding: 0.45em 1.2em 0.5em 0.95em; font-weight: 700;
    clip-path: polygon(0.55em 0, calc(100% - 0.55em) 0, 100% 50%, calc(100% - 0.55em) 100%, 0.55em 100%, 0 50%);
    background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 38%, #0b0e24), color-mix(in srgb, var(--accent) 16%, #05060f)); }
  /* 番号の台は面取りの八角形 */
  .chip i { font-style: normal; display: grid; place-items: center; width: 1.5em; height: 1.5em;
    clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%);
    background: var(--highlight); color: #07081a; font-size: 0.8em; }
  .brand { position: absolute; display: flex; align-items: center; gap: 0.6em; font-weight: 800; color: var(--highlight); }
  .brand img { height: 1.9em; border-radius: 22%; }
</style>
</head>
<body>
<div class="canvas" id="canvas"></div>
<script>
  const params = new URLSearchParams(location.search);
  const type = params.get("type") || "header";
  const lang = params.get("lang") || "ja";
  const appName = params.get("name") || "App";
  // 6.9 inch のスクリーンショットのファイル名（拡張子なし）。先頭が真ん中の端末に載る
  const screens = (params.get("screens") || "").split(",").filter(Boolean);
  document.body.dataset.lang = lang;

  // 言語ごとの文言（languages.json の 12 言語）。<em> で囲んだところが強調色になる
  const copy = {
    ja: {
      header: { title: "あなたのIDFAを、<em>Face IDの奥に</em>。", sub: "広告識別子をすぐに確認・コピー。同期するのは自分のiCloudだけ。" },
      search: { title: "IDFAを確認して、<br><em>すぐにコピー</em>。", chips: ["毎回Face IDでロック", "コピー・共有・QRコード", "自分のiCloudだけで同期"] },
    },
    en: {
      header: { title: "Your IDFA, <em>behind Face ID</em>.", sub: "Check and copy your advertising identifier in seconds. Synced only through your own iCloud." },
      search: { title: "See your IDFA,<br><em>copy it in a tap</em>.", chips: ["Locked with Face ID every time", "Copy, share or show a QR code", "Synced only via your iCloud"] },
    },
    "zh-Hans": {
      header: { title: "你的 IDFA，<em>锁在面容 ID 之后</em>。", sub: "几秒内查看并拷贝广告标识符，仅通过你自己的 iCloud 同步。" },
      search: { title: "查看 IDFA，<br><em>一键拷贝</em>。", chips: ["每次打开都用面容 ID 解锁", "拷贝、共享或显示二维码", "仅通过你的 iCloud 同步"] },
    },
    "zh-Hant": {
      header: { title: "你的 IDFA，<em>鎖在 Face ID 之後</em>。", sub: "幾秒內查看並拷貝廣告識別碼，只透過你自己的 iCloud 同步。" },
      search: { title: "查看 IDFA，<br><em>一點就拷貝</em>。", chips: ["每次打開都以 Face ID 解鎖", "拷貝、分享或顯示 QR 碼", "只透過你的 iCloud 同步"] },
    },
    ko: {
      header: { title: "내 IDFA를 <em>Face ID 뒤에</em>.", sub: "광고 식별자를 몇 초 만에 확인하고 복사하십시오. 동기화는 내 iCloud로만 이루어집니다." },
      search: { title: "IDFA를 확인하고<br><em>탭 한 번으로 복사</em>.", chips: ["열 때마다 Face ID로 잠금", "복사, 공유, QR 코드", "내 iCloud로만 동기화"] },
    },
    es: {
      header: { title: "Tu IDFA, <em>tras Face ID</em>.", sub: "Consulta y copia tu identificador de publicidad en segundos. Se sincroniza solo con tu iCloud." },
      search: { title: "Ve tu IDFA y<br><em>cópialo con un toque</em>.", chips: ["Bloqueo con Face ID siempre", "Copiar, compartir o código QR", "Sincronizado solo con tu iCloud"] },
    },
    fr: {
      header: { title: "Votre IDFA, <em>derrière Face ID</em>.", sub: "Consultez et copiez votre identifiant publicitaire en quelques secondes. Synchronisé uniquement via votre iCloud." },
      search: { title: "Votre IDFA,<br><em>copié d’un toucher</em>.", chips: ["Verrouillé par Face ID", "Copier, partager ou code QR", "Synchronisé via votre iCloud"] },
    },
    de: {
      header: { title: "Deine IDFA, <em>hinter Face ID</em>.", sub: "Werbe-ID in Sekunden sehen und kopieren. Nur über deine eigene iCloud synchronisiert." },
      search: { title: "IDFA sehen,<br><em>mit einem Tipp kopieren</em>.", chips: ["Bei jedem Öffnen Face ID", "Kopieren, teilen oder QR-Code", "Nur über deine iCloud"] },
    },
    it: {
      header: { title: "Il tuo IDFA, <em>dietro Face ID</em>.", sub: "Controlla e copia l’identificatore pubblicitario in pochi secondi. Sincronizzato solo tramite il tuo iCloud." },
      search: { title: "Vedi il tuo IDFA,<br><em>copialo con un tocco</em>.", chips: ["Bloccato con Face ID", "Copia, condividi o codice QR", "Sincronizzato con il tuo iCloud"] },
    },
    "pt-BR": {
      header: { title: "Seu IDFA, <em>protegido pelo Face ID</em>.", sub: "Veja e copie seu identificador de publicidade em segundos. Sincronizado só pelo seu iCloud." },
      search: { title: "Veja seu IDFA e<br><em>copie com um toque</em>.", chips: ["Bloqueio com Face ID sempre", "Copiar, compartilhar ou QR", "Sincronizado só pelo seu iCloud"] },
    },
    ru: {
      header: { title: "Ваш IDFA <em>под защитой Face ID</em>.", sub: "Смотрите и копируйте рекламный идентификатор за секунды. Синхронизация только через ваш iCloud." },
      search: { title: "Смотрите IDFA и<br><em>копируйте касанием</em>.", chips: ["Face ID при каждом запуске", "Копировать, поделиться, QR", "Только через ваш iCloud"] },
    },
    id: {
      header: { title: "IDFA Anda, <em>di balik Face ID</em>.", sub: "Lihat dan salin pengenal iklan dalam hitungan detik. Hanya diselaraskan melalui iCloud Anda." },
      search: { title: "Lihat IDFA,<br><em>salin sekali ketuk</em>.", chips: ["Dikunci Face ID setiap kali", "Salin, bagikan, atau kode QR", "Hanya lewat iCloud Anda"] },
    },
  }[lang];
  // 文言の無い言語は、背景だけの画像を書き出さないようここで止める（render_creative_assets.sh でも先に確かめる）
  if (!copy || screens.length === 0) {
    document.body.innerHTML = `<h1 style="color:red;font-size:200px">No copy or screens for "${lang}"</h1>`;
    throw new Error(`creative.html に ${lang} の文言か画面がありません`);
  }

  const canvas = document.getElementById("canvas");
  const W = innerWidth;
  const add = (html) => { canvas.insertAdjacentHTML("beforeend", html); return canvas.lastElementChild; };
  // 画面が足りないときは、ある画面を繰り返して使う
  const screen = (index) => screens[index % screens.length];
  const phone = (index, x, y, width, rotate = 0, z = 1) => add(
    `<div class="phone" style="left:${x - width / 2}px;top:${y}px;width:${width}px;transform:rotate(${rotate}deg);z-index:${z}">` +
    `<img src="screens/${lang}/${screen(index)}.png"></div>`);
  const glow = (size, x, y) => add(`<div class="glow" style="width:${size}px;height:${size}px;left:${x - size / 2}px;top:${y - size / 2}px"></div>`);

  if (type === "header") {
    // 21:9（3840x1646）。中央に寄せる（左右は端末によって切れる）
    glow(2200, W / 2, 1300);
    const title = add(`<div class="headline" style="top:150px;font-size:128px">${copy.header.title}</div>`);
    add(`<div class="sub" style="top:${150 + title.offsetHeight + 34}px;font-size:58px">${copy.header.sub}</div>`);
    if (screens.length > 1) {
      phone(1, W / 2 - 700, 690, 560, -7, 1);
      phone(2, W / 2 + 700, 690, 560, 7, 1);
    }
    phone(0, W / 2, 560, 640, 0, 2);
  } else {
    // 3:2（3840x2560）。左に何のアプリかと主な機能、右に実際の画面
    glow(2600, W - 1000, 1400);
    add(`<div class="brand" style="left:250px;top:200px;font-size:86px"><img src="icon.png">${appName}</div>`);
    // 右の端末（傾けた左端が x=1650px あたり）にかからない幅にする。長い言語（ロシア語など）は折り返す
    add(`<div class="copy" style="left:250px;top:470px;width:1400px;font-size:150px">` +
        `<div class="title">${copy.search.title}</div>` +
        `<div class="chips" style="font-size:78px;margin-top:110px">` +
        copy.search.chips.map((c, i) => `<div class="chip"><i>${i + 1}</i>${c}</div>`).join("") +
        `</div></div>`);
    if (screens.length > 1) {
      phone(1, W - 1700, 520, 860, -6, 1);
    }
    phone(0, W - 900, 360, 980, 4, 2);
  }
</script>
</body>
</html>
