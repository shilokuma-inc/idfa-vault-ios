name: Upload

# develop / release/** への push で Archive → Export → App Store Connect へアップロードする（iOS・macOS・visionOS）。
# 作業ブランチを TestFlight で確認したいときは、手動実行（workflow_dispatch）でそのブランチを選ぶ。
# 作業ブランチの push ごとに上げると、App Store Connect の 24 時間あたりのアップロード上限に当たるため自動では上げない。
on:
  push:
    branches:
      - develop
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

# ブランチをまたいで run を 1 本ずつ流す。ビルド番号は Xcode が App Store Connect の最新ビルドを見て決めるため、
# develop と release/** の run が並ぶと同じ番号を選んで片方のアップロードが失敗する。直前に上げたビルドはすぐには
# 数えられず、同じプラットフォームのアップロードが続くと重ならなくても失敗する（LEARNINGS.md）ので、
# プラットフォームごとではなく run ごとに並べ、あいだに後の run の archive（数分）を挟む。
# 既定の待機は 1 本だけで、3 本目が来ると待機中の run が通知なく取り消されるため、queue: max で 100 本まで待たせる。
# アップロード途中でキャンセルすると App Store Connect 側に中途半端なビルドが残るため、
# 実行中のものは完了させる（queue: max は cancel-in-progress: true と組み合わせられない）
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max

jobs:
  # iOS → macOS → visionOS の順に 1 つずつ流す。macOS ランナーの同時実行枠（Organization 全体で 5）を 1 つしか使わないため。
  # 前のプラットフォームが失敗しても次は流す（!cancelled()）。
  # App Store Connect のアプリに macOS・visionOS のプラットフォームが無いうちは、_archive.yml が確かめて archive を飛ばす（失敗にしない）
  upload:
    # テンプレートリポジトリ自身など、App Store Connect にアプリが無いリポジトリではリポジトリ変数 ENABLE_DELIVERY=false でスキップする。
    # Archive（main で Export まで確認する）はアプリが無くても通るので止めない
    if: vars.ENABLE_DELIVERY != 'false'
    permissions:
      contents: read
    uses: ./.github/workflows/_archive.yml
    with:
      platform: iOS
      upload: true
    secrets: inherit

  upload-macos:
    # macOS だけを止めたいときはリポジトリ変数 ENABLE_MACOS_DELIVERY=false にする
    needs: upload
    if: ${{ !cancelled() && vars.ENABLE_DELIVERY != 'false' && vars.ENABLE_MACOS_DELIVERY != 'false' }}
    permissions:
      contents: read
    uses: ./.github/workflows/_archive.yml
    with:
      platform: macOS
      upload: true
    secrets: inherit

  upload-visionos:
    # visionOS だけを止めたいときはリポジトリ変数 ENABLE_VISIONOS_DELIVERY=false にする
    needs: upload-macos
    if: ${{ !cancelled() && vars.ENABLE_DELIVERY != 'false' && vars.ENABLE_VISIONOS_DELIVERY != 'false' }}
    permissions:
      contents: read
    uses: ./.github/workflows/_archive.yml
    with:
      platform: visionOS
      upload: true
    secrets: inherit
